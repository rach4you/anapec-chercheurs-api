openapi: 3.0.3
info:
  title: ANAPEC Chercheurs API
  version: 1.0.0
  description: API sécurisée pour la gestion et l'exposition des Web Services ANAPEC Chercheurs.
servers:
  - url: http://127.0.0.1:8000/api/v1
    description: Local development

security:
  - BearerAuth: []

tags:
  - name: Authentication
    description: Login, logout, and current user
  - name: Admin - Users
    description: Admin user management
  - name: Admin - Web Services
    description: Admin web service management
  - name: Admin - Domains
    description: Admin web service domain management
  - name: Services
    description: Web service consumption endpoints
  - name: User
    description: Read-only view of the current user's own data

paths:
  # ── AUTH ──
  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate and obtain a Sanctum token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  description: User email
                password:
                  type: string
                  format: password
                  description: User password (min 8 chars)
      responses:
        '200':
          description: Authenticated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Authenticated." }
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      token:
                        type: string
                        description: Sanctum Bearer token
                      token_type:
                        type: string
                        example: Bearer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Account deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: Account is deactivated.
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current Sanctum token
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Logged out." }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get the currently authenticated user
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema:
                 type: object
                 properties:
                   success: { type: boolean, example: true }
                   message: { type: string, example: "Authenticated user." }
                   data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── USER SELF-SERVICE ──
  /user/web-services:
    get:
      tags: [User]
      summary: List the current user's Web Service permissions (read-only)
      description: >
        Returns ALL registered Web Services for the currently authenticated
        user only. No user_id parameter is accepted. effective_access is
        true when the user is active, the service is globally active, and
        access is granted by the global "all" scope or an explicitly
        enabled direct permission row — unless an explicit disabled
        override row denies it.
        access_scope, override_disabled, and grant_source report how
        access is obtained.
      responses:
        '200':
          description: Own Web Service permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Web Services retrieved." }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserWebServicePermission'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── ADMIN USERS ──
  /admin/users:
    get:
      tags: [Admin - Users]
      summary: List all API users
      responses:
        '200':
          description: Users list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Users retrieved." }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin - Users]
      summary: Create an API user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "User created." }
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: User ID
    get:
      tags: [Admin - Users]
      summary: Get a single user
      responses:
        '200':
          description: User retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "User retrieved." }
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Admin - Users]
      summary: Update a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "User updated." }
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/users/{id}/status:
    parameters:
      - $ref: '#/components/parameters/UserID'
    patch:
      tags: [Admin - Users]
      summary: Toggle user active/inactive status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active:
                  type: boolean
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "User status updated." }
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/users/{id}/password:
    parameters:
      - $ref: '#/components/parameters/UserID'
    post:
      tags: [Admin - Users]
      summary: Reset a user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "User password has been reset." }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/users/{id}/web-services:
    parameters:
      - $ref: '#/components/parameters/UserID'
    get:
      tags: [Admin - Users]
      summary: List Web Services assigned to a user
      description: >
        Returns only the permissions this user is actually assigned to.
        To view every registered Web Service for a user, see
        `GET /user/web-services`.
      responses:
        '200':
          description: Web Services for user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Web Services retrieved." }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserWebServicePermission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Admin - Users]
      summary: Assign/replace Web Services for a user
      description: >
        Bulk/full replacement of the whole assigned set. At least one Web
        Service must be provided (an empty list is invalid) and every
        submitted service must exist and be globally active. Use
        `PATCH /admin/users/{id}/web-services/{code}` to toggle a single
        permission, and `DELETE /admin/users/{id}/web-services` to revoke
        every permission at once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignWebServices'
      responses:
        '200':
          description: Web Services assigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Web Services assigned." }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Admin - Users]
      summary: Revoke every Web Service permission for a user
      description: >
        Removes all Web Service permission rows for the user. The operation
        is idempotent: deleting twice returns 200 both times. This is the
        only supported way to revoke every permission at once - `PUT` with an
        empty list remains invalid.
      responses:
        '200':
          description: Every Web Service permission was revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Web Services revoked." }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/users/{id}/web-services/{code}:
    parameters:
      - $ref: '#/components/parameters/UserID'
      - $ref: '#/components/parameters/WebServiceCode'
    patch:
      tags: [Admin - Users]
      summary: Enable or disable one Web Service permission for a user
      description: >
        Single-permission management: toggles the `is_enabled` flag of the
        user's permission for one Web Service. Enabling requires the Web
        Service to be globally active, otherwise a 422 is returned with
        "Web Service '{code}' is not active.". Disabling is always allowed,
        even for an inactive Web Service: access can be withdrawn from a
        service that is no longer offered. When no permission row exists,
        enabling creates one; disabling a never-granted permission returns
        "Permission unchanged." without creating a meaningless row. A no-op
        request leaves `updated_at` untouched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserWebServicePermission'
      responses:
        '200':
          description: Permission updated, unchanged, or preserved as absent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    type: string
                    example: "Permission updated."
                  data:
                    $ref: '#/components/schemas/UserWebServicePermission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Unknown user or unknown Web Service code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: "Web Service 'WS_CV' does not exist."
        '422':
          description: Validation failed, or enabling a globally inactive service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: "Web Service 'WS_CV' is not active."

  # ── ADMIN WEB SERVICES ──
  /admin/web-services:
    get:
      tags: [Admin - Web Services]
      summary: List all Web Services
      responses:
        '200':
          description: Web Services list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Web Services retrieved." }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebService'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/web-services/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          example: WS_CHECK_CIN
        description: Web Service code
    get:
      tags: [Admin - Web Services]
      summary: Get a Web Service by code
      responses:
        '200':
          description: Web Service retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Web Service retrieved." }
                  data:
                    $ref: '#/components/schemas/WebService'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Admin - Web Services]
      summary: Update Web Service metadata
      description: >
        Updates the updatable metadata (name, description) of a Web Service.
        The code is a technical identifier and is immutable. The global status
        is managed by its dedicated status endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebService'
      responses:
        '200':
          description: Web Service updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Web Service updated." }
                  data:
                    $ref: '#/components/schemas/WebService'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/web-services/{code}/status:
    parameters:
      - $ref: '#/components/parameters/WebServiceCode'
    patch:
      tags: [Admin - Web Services]
      summary: Toggle global Web Service status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active:
                  type: boolean
      responses:
        '200':
          description: Web Service status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Web Service status updated successfully." }
                  data:
                    type: object
                    properties:
                      code: { type: string, example: WS_CV }
                      is_active: { type: boolean, example: false }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ── ADMIN DOMAINS ──
  /admin/domains:
    get:
      tags: [Admin - Domains]
      summary: List all Web Service domains
      responses:
        '200':
          description: Domains list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Web Service domains retrieved." }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebServiceDomain'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin - Domains]
      summary: Create a Web Service domain
      description: >
        The code is upper-cased and must be unique. An empty service list is
        not required at creation; a domain starts with zero members until
        services are assigned via its dedicated endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, example: OFFRES }
                name: { type: string, example: Offres }
                description: { type: string, nullable: true, example: "Offer domain." }
                is_active: { type: boolean, example: true }
                sort_order: { type: integer, example: 0 }
      responses:
        '201':
          description: Domain created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Web Service domain created." }
                  data:
                    $ref: '#/components/schemas/WebServiceDomain'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/domains/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          example: CHERCHEURS
        description: Web Service domain code
    get:
      tags: [Admin - Domains]
      summary: Get a Web Service domain by code
      responses:
        '200':
          description: Domain retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Web Service domain retrieved." }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/WebServiceDomain'
                      - type: object
                        properties:
                          web_services:
                            type: array
                            items: { type: string }
                            example: [WS_CHECK_CIN, WS_PROFILE]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Admin - Domains]
      summary: Update Web Service domain metadata
      description: >
        Updates the updatable metadata (name, description, sort_order). The code
        is a technical identifier and is immutable. The status is managed by its
        dedicated status endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: "Chercheurs" }
                description: { type: string, nullable: true, example: "Researcher domain." }
                sort_order: { type: integer, example: 0 }
      responses:
        '200':
          description: Domain updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Web Service domain updated." }
                  data:
                    $ref: '#/components/schemas/WebServiceDomain'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/domains/{code}/status:
    parameters:
      - $ref: '#/components/parameters/WebServiceCode'
    patch:
      tags: [Admin - Domains]
      summary: Toggle Web Service domain status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active:
                  type: boolean
      responses:
        '200':
          description: Domain status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Web Service domain status updated." }
                  data:
                    type: object
                    properties:
                      code: { type: string, example: CHERCHEURS }
                      is_active: { type: boolean, example: false }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/domains/{code}/services:
    parameters:
      - $ref: '#/components/parameters/WebServiceCode'
    put:
      tags: [Admin - Domains]
      summary: Assign Web Services to a domain
      description: >
        Full-replace membership: removes every membership row then re-creates
        the provided set. An empty list is rejected (a domain must keep at
        least one member).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [web_services]
              properties:
                web_services:
                  type: array
                  minItems: 1
                  items: { type: string, example: WS_CHECK_CIN }
      responses:
        '200':
          description: Domain services updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Domain services updated." }
                  data:
                    type: object
                    properties:
                      code: { type: string, example: CHERCHEURS }
                      web_services:
                        type: array
                        items: { type: string }
                        example: [WS_CHECK_CIN, WS_PROFILE]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ── ADMIN USER DOMAIN PERMISSIONS ──
  /admin/users/{id}/domains:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          example: 1
        description: User ID
    get:
      tags: [Admin - Users]
      summary: List a user's Web Service domain grants
      description: >
        Returns the user's domain grants (code, active status, service count,
        enabled flag) plus the effective Web Service state for the entire
        catalogue. Domain grants are the normal access path; direct
        api_user_web_services rows remain the override channel.
      responses:
        '200':
          description: Domains and effective states
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Domains and effective Web Service states retrieved." }
                  data:
                    type: object
                    properties:
                      domains:
                        type: array
                        items:
                          type: object
                          properties:
                            code: { type: string, example: CHERCHEURS }
                            name: { type: string, example: Chercheurs }
                            domain_is_active: { type: boolean, example: true }
                            service_count: { type: integer, example: 4 }
                            is_enabled: { type: boolean, example: true }
                      web_services:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserWebServicePermission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Admin - Users]
      summary: Assign Web Service domains to a user (full replace)
      description: >
        Replaces the user's entire set of domain grants. Does not touch
        api_user_web_services override rows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domains]
              properties:
                domains:
                  type: array
                  minItems: 1
                  items: { type: string, example: CHERCHEURS }
      responses:
        '200':
          description: Domains assigned
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/users/{id}/domains/{code}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          example: 1
      - $ref: '#/components/parameters/WebServiceCode'
    patch:
      tags: [Admin - Users]
      summary: Enable or disable a single user domain grant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_enabled]
              properties:
                is_enabled: { type: boolean, example: true }
      responses:
        '200':
          description: Domain grant updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Permission updated." }
                  data:
                    type: object
                    properties:
                      code: { type: string, example: CHERCHEURS }
                      name: { type: string, example: Chercheurs }
                      domain_is_active: { type: boolean, example: true }
                      service_count: { type: integer, example: 4 }
                      is_enabled: { type: boolean, example: false }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ── SERVICES ──
  /services/check-cin:
    post:
      tags: [Services]
      summary: Check if a researcher exists by CIN
      description: |
        Protected by:
        - `auth:api` (Sanctum)
        - `ws:WS_CHECK_CIN` (permission middleware)
        - `throttle:60,1` (rate limit: 60 requests/minute)

        Global access rule: the user must have WS_CHECK_CIN enabled in
        `api_user_web_services` AND the global `api_web_services.is_active`
        must be `true`. Otherwise returns 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cin]
              properties:
                cin:
                  type: string
                  maxLength: 15
                  example: "EA154824"
                  description: Carte d'Identité Nationale number
      responses:
        '200':
          description: CIN check completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "CIN check completed." }
                  data:
                    type: object
                    properties:
                      exists:
                        type: boolean
                        description: Whether the CIN was found in SIGEC
              examples:
                exists:
                  value:
                    success: true
                    message: "CIN check completed."
                    data:
                      exists: true
                notFound:
                  value:
                    success: true
                    message: "CIN check completed."
                    data:
                      exists: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Forbidden when:
            - WS_CHECK_CIN permission not assigned or disabled for the user
            - WS_CHECK_CIN globally disabled
            - User is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /services/inscription:
    post:
      tags: [Services]
      summary: Fully register a new researcher
      description: |
        Inserts a researcher in SIGEC `CHERCHEURS` and all related tables
        inside a single DB transaction. Every insert is rolled back if any
        step fails — no partial data ever survives.

        Protected by:
        - `auth:api` (Sanctum)
        - `ws:WS_INSCRIPTION` (permission middleware)
        - `throttle:60,1` (rate limit: 60 requests/minute)

        Global access rule: the user must have WS_INSCRIPTION enabled in
        `api_user_web_services` AND the global `api_web_services.is_active`
        must be `true`. Otherwise returns 403.

        The server generates the `CHERCHEUR_ID` from the SIGEC sequence
        (via the `TRIG_CHERCEUR` trigger). Any client-supplied `chercheur_id`
        or `id` field is silently stripped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chercheur]
              properties:
                chercheur:
                  type: object
                  required:
                    - nationalite
                    - cin
                    - password
                    - nom_candidat
                    - prenom
                    - sexe
                    - situation_familiale
                    - date_naissance
                    - adresse
                    - ville_id
                    - commune_id
                    - e_mail
                    - n_gsm
                    - situation_p_r_emploi
                  properties:
                    nationalite: { type: integer, example: 0 }
                    cin:
                      type: string
                      minLength: 2
                      maxLength: 15
                      example: "BJ5556"
                    password:
                      type: string
                      minLength: 6
                      maxLength: 30
                      example: "123456"
                    nom_candidat: { type: string, maxLength: 50, example: "rachid" }
                    prenom: { type: string, maxLength: 50, example: "lahmami" }
                    sexe: { type: string, maxLength: 50, example: "M" }
                    situation_familiale: { type: string, maxLength: 50, example: "Célibataire" }
                    date_naissance:
                      type: string
                      format: date
                      description: Expected format `dd-mm-yyyy`.
                      example: "18-09-1996"
                    adresse: { type: string, maxLength: 500, example: "Anapec 4 lotissement la colline" }
                    ville_id: { type: integer, example: 11 }
                    commune_id: { type: integer, example: 7728 }
                    e_mail: { type: string, format: email, maxLength: 100, example: "rachidlahmami@gmail.com" }
                    n_gsm: { type: string, maxLength: 50, example: "0656565656" }
                    situation_p_r_emploi: { type: string, maxLength: 50, example: "Sans emploi" }
                    n_gsm2: { type: string, maxLength: 50, example: "0454545454" }
                    tel: { type: string, maxLength: 50, example: "0455445454" }
                    mois_chomage: { type: string, maxLength: 2, example: "4" }
                    duree_chomage: { type: string, maxLength: 10, example: "2015" }
                    handicape: { type: string, maxLength: 10, example: "oui" }
                    nature_handicape: { type: string, maxLength: 50, example: "Aveugle" }
                    competences_specifiques: { type: string, maxLength: 4000 }
                    activites_extra_pro: { type: string, maxLength: 500 }
                    date_inscription:
                      type: string
                      format: date
                      description: Optional. Server always overwrites with the current date.
                    date_derniere_actualisation:
                      type: string
                      format: date
                      description: Optional. Server always overwrites with the current date.
                    provenance: { type: string, maxLength: 2, example: "F" }
                    agence_id: { type: integer, example: 123 }
                    is_diplome: { type: integer, enum: [0, 1], example: 1 }
                mobilites:
                  type: array
                  description: mobilite_id values stored in `chercheurs_mobilites`.
                  items: { type: integer, example: 1 }
                diplomes:
                  type: array
                  description: Rows written to `avoir_diplomes`.
                  items:
                    type: object
                    required: [diplome_id, specialite_id, option_diplome_id, groupe_etablissement_id, etablissement_id, date_optention, commentaire]
                    properties:
                      diplome_id: { type: integer, example: 31 }
                      specialite_id: { type: integer, example: 31295 }
                      option_diplome_id: { type: integer, example: 312951587 }
                      groupe_etablissement_id: { type: integer, example: 10 }
                      etablissement_id: { type: integer, example: 723 }
                      date_optention: { type: string, maxLength: 20, example: "2018" }
                      commentaire: { type: string, maxLength: 500, example: "BAC+2 TEST COMENTAIRE" }
                experiences:
                  type: array
                  description: Rows written to `experience_proffes`.
                  items:
                    type: object
                    required: [date_debut, ce_jour, employeur, intitule_poste, duree_experience_id]
                    properties:
                      date_debut: { type: string, format: date, example: "01-09-2023" }
                      date_fin: { type: string, format: date, nullable: true, example: "19-09-2024" }
                      ce_jour: { type: integer, enum: [0, 1], example: 1 }
                      employeur: { type: string, maxLength: 200, example: "ANAPEC" }
                      intitule_poste: { type: string, maxLength: 150, example: "DEVELOPPEUR" }
                      commentaire: { type: string, maxLength: 400, nullable: true }
                      duree_experience_id: { type: integer, example: 4 }
                bureautiques:
                  type: array
                  description: bureautique_id values stored in `bureautiques_chercheurs`.
                  items: { type: integer, example: 1 }
                permis:
                  type: array
                  description: permi_conduire_id values stored in `avoir_permis`.
                  items: { type: integer, example: 3 }
                langues:
                  type: array
                  description: |
                    Rows written to `langues_parlees`. Duplicate
                    `competence_linguistique_id` values in the same request
                    are silently collapsed to a single row (first wins).
                  items:
                    type: object
                    required: [competence_linguistique_id, niveau]
                    properties:
                      competence_linguistique_id: { type: integer, example: 1 }
                      niveau: { type: string, maxLength: 50, example: "Courant" }
                emplois_metiers:
                  type: array
                  description: Rows written to `chercher_emplois`.
                  items:
                    type: object
                    required: [emploi_metier_id]
                    properties:
                      emploi_metier_id: { type: integer, example: 47141 }
            example:
              chercheur:
                nationalite: 0
                cin: "BJ5556"
                password: "123456"
                nom_candidat: "rachid"
                prenom: "lahmami"
                sexe: "M"
                situation_familiale: "Célibataire"
                date_naissance: "18-09-1996"
                adresse: "Anapec 4 lotissement la colline"
                ville_id: 11
                commune_id: 7728
                e_mail: "rachidlahmami@gmail.com"
                n_gsm: "0656565656"
                n_gsm2: "0454545454"
                tel: "0455445454"
                situation_p_r_emploi: "Sans emploi"
                mois_chomage: "4"
                duree_chomage: "2015"
                handicape: "oui"
                nature_handicape: "Aveugle"
                competences_specifiques: "PhotoShop, DreamWeaver, Flash"
                activites_extra_pro: "DEVELOPPEUR SENIOR DATA BASE ORACLE"
                date_inscription: "23-09-2026"
                date_derniere_actualisation: "23-09-2026"
                provenance: "F"
                agence_id: 123
                is_diplome: 1
              mobilites: [1, 2, 3, 4]
              diplomes:
                - diplome_id: 31
                  specialite_id: 31295
                  option_diplome_id: 312951587
                  groupe_etablissement_id: 10
                  etablissement_id: 723
                  date_optention: "2018"
                  commentaire: "BAC+2 TEST COMENTAIRE"
                - diplome_id: 33
                  specialite_id: 33452
                  option_diplome_id: 334521520
                  groupe_etablissement_id: 17
                  etablissement_id: 731
                  date_optention: "2017"
                  commentaire: "BAC+4 TEST COMENTAIRE"
              experiences:
                - date_debut: "01-09-2023"
                  date_fin: "19-09-2024"
                  ce_jour: 0
                  employeur: "ORACLE"
                  intitule_poste: "DATA BASE ADMIN"
                  commentaire: "TEST DATA BASE ADMIN EXP"
                  duree_experience_id: 4
                - date_debut: "11-09-2025"
                  ce_jour: 1
                  employeur: "ANAPEC"
                  intitule_poste: "DEVELOPPEUR"
                  commentaire: "TEST DEVELOPPEUR"
                  duree_experience_id: 4
              bureautiques: [1, 2, 3, 4]
              permis: [3, 1, 2]
              langues:
                - competence_linguistique_id: 1
                  niveau: "Courant"
                - competence_linguistique_id: 4
                  niveau: "Courant"
                - competence_linguistique_id: 8
                  niveau: "Moyen"
              emplois_metiers:
                - emploi_metier_id: 47141
      responses:
        '201':
          description: Researcher and all relations created inside a single transaction
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Chercheur enregistré avec succès." }
                  data:
                    type: object
                    properties:
                      chercheur_id:
                        type: integer
                        description: ID generated by the SIGEC sequence `chercheurs_seq`.
                        example: 9651573
                      cin: { type: string, example: "BJ5556" }
                      email: { type: string, example: "rachidlahmami@gmail.com" }
              examples:
                success:
                  value:
                    success: true
                    message: "Chercheur enregistré avec succès."
                    data:
                      chercheur_id: 9651573
                      cin: "BJ5556"
                      email: "rachidlahmami@gmail.com"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Forbidden when:
            - WS_INSCRIPTION permission not assigned or disabled for the user
            - WS_INSCRIPTION globally disabled
            - User is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            Duplicate identifier conflict. Two variants exist, disambiguated
            by the `code` field:
            - `CIN_ALREADY_EXISTS` — the CIN already exists in `CHERCHEURS`.
            - `EMAIL_ALREADY_EXISTS` — the email already exists (case-insensitive).
          content:
            application/json:
              examples:
                cinDuplicate:
                  summary: CIN already registered
                  value:
                    success: false
                    message: "Un chercheur existe déjà avec ce CIN."
                    code: "CIN_ALREADY_EXISTS"
                emailDuplicate:
                  summary: Email already registered
                  value:
                    success: false
                    message: "Un chercheur existe déjà avec cet email."
                    code: "EMAIL_ALREADY_EXISTS"
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          description: |
            Unexpected internal error. If raised during the transaction, every
            insert is rolled back — no CHERCHEURS row or relation rows survive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: |
        Enter your Sanctum Bearer token.
        Obtain a token by calling `POST /auth/login` with valid credentials.

  parameters:
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: User ID

    WebServiceCode:
      name: code
      in: path
      required: true
      schema:
        type: string
      description: Web Service code

  responses:
    Unauthorized:
      description: Unauthenticated or inactive user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            message: Unauthenticated.

    Forbidden:
      description: Authenticated but not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            message: Insufficient permissions.

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            message: Not found.

    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
          example:
            success: false
            message: The cin field is required.
            errors:
              cin:
                - The cin field is required.

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Admin User"
        email:
          type: string
          format: email
          example: "admin@example.com"
        role:
          type: string
          enum: [admin, user]
          example: admin
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    WebService:
      type: object
      properties:
        id:
          type: integer
          example: 1
        code:
          type: string
          example: WS_CHECK_CIN
        name:
          type: string
          example: "Check CIN"
        description:
          type: string
          nullable: true
          example: "Verify a CIN number"
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    UserWebServicePermission:
      type: object
      properties:
        code:
          type: string
          example: WS_CV
        name:
          type: string
          example: "CV"
        description:
          type: string
          nullable: true
          example: "Fetch the full CV of a researcher."
        global_is_active:
          type: boolean
          example: true
        is_enabled:
          type: boolean
          description: Whether the user holds a direct enabled permission row for this service.
          example: true
        access_scope:
          type: string
          description: "The user's access scope: 'all' (every active service in every domain) or 'selected' (only explicitly enabled services)."
          enum: [all, selected]
          example: selected
        override_disabled:
          type: boolean
          description: "Whether an explicit disabled override row denies access."
          example: false
        grant_source:
          type: string
          description: "How access is obtained: global, direct, or none."
          enum: [global, direct, none]
          example: direct
        effective_access:
          type: boolean
          description: >
            Final access state computed server-side. True when the user is active, the service is
            globally active, and either the user has the global "all" access scope or an explicitly
            enabled direct permission row exists — unless an explicit disabled override row denies it.
          example: true

    WebServiceDomain:
      type: object
      properties:
        id:
          type: integer
          example: 1
        code:
          type: string
          example: CHERCHEURS
        name:
          type: string
          example: Chercheurs
        description:
          type: string
          nullable: true
          example: "Web Services relating to the researcher domain."
        is_active:
          type: boolean
          example: true
        sort_order:
          type: integer
          example: 0
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    CreateUser:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          maxLength: 255
          example: "New User"
        email:
          type: string
          format: email
          maxLength: 255
          example: "user@example.com"
        password:
          type: string
          format: password
          minLength: 8
        role:
          type: string
          enum: [admin, user]
          description: Defaults to "user"
        is_active:
          type: boolean
          description: Defaults to true

    UpdateUser:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
        role:
          type: string
          enum: [admin, user]

    UpdateWebService:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
          description: Web Service display name
          example: "Check CIN"
        description:
          type: string
          maxLength: 500
          nullable: true
          description: Optional Web Service description
          example: "Verify a CIN number"

    AssignWebServices:
      type: object
      required: [web_services]
      properties:
        web_services:
          type: array
          minItems: 1
          items:
            type: object
            required: [code]
            properties:
              code:
                type: string
                maxLength: 60
                description: Web Service code (must exist and be active)
                example: WS_CHECK_CIN
              enabled:
                type: boolean
                description: Defaults to true

    UpdateUserWebServicePermission:
      type: object
      required: [is_enabled]
      properties:
        is_enabled:
          type: boolean
          description: >
            Enable the permission when true (the Web Service must be globally
            active), or disable it when false (always allowed, even for an
            inactive Web Service).
          example: true

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
